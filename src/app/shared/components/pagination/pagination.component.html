
  <ul class="pagination justify-content-center">

    @if(showPrevNext()) {

      <li
        class="page-item"
        [class.disabled]="currentPage() === 1"
      >

        <button
          class="page-link"
          (click)="selectPage(currentPage() - 1)"
        >
          {{ 'SIDEBAR.pagination.prev' | translate }}
        </button>

      </li>

    }

    @for(page of pages(); track page) {

      <li
        class="page-item"
        [class.active]="page === currentPage()"
      >

        <button
          class="page-link"
          (click)="selectPage(page)"
        >
          {{ page }}
        </button>

      </li>

    }

    @if(showPrevNext()) {

      <li
        class="page-item"
        [class.disabled]="currentPage() === totalPages().length"
      >

        <button
          class="page-link"
          (click)="selectPage(currentPage() + 1)"
        >
          {{ 'SIDEBAR.pagination.next' | translate }}
        </button>

      </li>

    }

  </ul>
